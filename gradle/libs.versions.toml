[versions]
android-compileSdk = "37"
android-minSdk = "30"
android-targetSdk = "37"
kotlin = "2.4.10"
kio = "0.0.1"
hash = "0.5.6"
androidGradlePlugin = "9.1.0"
kotlinxCoroutines = "1.11.0"
koin-bom = "4.2.2"
compose-bom = "2026.05.01"
retainedmodel = "1.0.3"
androidxActivity = "1.13.0"
ktor = "3.6.1"
navigation3Ui = "1.2.1"
androidxCoreSplashscreen = "1.2.0"
webrtcAndroid = "150.7871.01"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.12.0" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kio-http = { module = "io.github.kio-labs:kio-http", version.ref = "kio" }
kio-compression = { module = "io.github.kio-labs:kio-compression", version.ref = "kio" }
kio-tls = { module = "io.github.kio-labs:kio-tls", version.ref = "kio" }
kio-postgres-connection = { module = "io.github.kio-labs:postgres-connection", version.ref = "kio" }
kio-postgres-migration = { module = "io.github.kio-labs:postgres-migration", version.ref = "kio" }
kio-io = { module = "io.github.kio-labs:async-io", version.ref = "kio" }
kio-poller-select = { module = "io.github.kio-labs:poller-jvm-select", version.ref = "kio" }
kio-poller-uring = { module = "io.github.kio-labs:poller-linux-uring", version.ref = "kio" }
hash-sha2 = { group = "org.kotlincrypto.hash", name = "sha2", version.ref = "hash" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

# android dependencies
webrtc-android = { module = "io.github.webrtc-sdk:android", version.ref = "webrtcAndroid" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
androidx-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-android = { module = "io.insert-koin:koin-android" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
retainedmodel = { group = "io.github.andannn", name = "retainedmodel", version.ref = "retainedmodel" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3Ui" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxCoreSplashscreen" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradlePlugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
